name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Smoke test
        run: |
          echo 'graph TD
            A --> B --> C' | ./target/release/mermaid-tui

      - name: Verify demo renders
        run: |
          ./target/release/mermaid-tui < demo/mermaid-to-md-demo.md > /dev/null || true
