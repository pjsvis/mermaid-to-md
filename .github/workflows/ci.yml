name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Install just (Linux)
        if: runner.os == 'Linux'
        run: |
          ARCH=$(uname -m)
          curl -fsSL "https://github.com/casey/just/releases/latest/download/just-${ARCH}-unknown-linux-musl" -o /usr/local/bin/just
          chmod +x /usr/local/bin/just

      - name: Install just (macOS)
        if: runner.os == 'macOS'
        run: |
          ARCH=$(uname -m)
          curl -fsSL "https://github.com/casey/just/releases/latest/download/just-${ARCH}-apple-darwin" -o /usr/local/bin/just
          chmod +x /usr/local/bin/just

      - name: Install just (Windows)
        if: runner.os == 'Windows'
        run: cargo install just

      - name: Run test suite (build → check-docs → inject/verify regression)
        run: just test

      - name: Smoke test — render via stdin
        shell: bash
        run: |
          printf 'graph TD\n  A --> B --> C\n' | ./target/release/mermaid-tui

  npm-pack:
    name: Validate npm packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build release binary (for the host platform)
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Place binary into the host platform package
        run: |
          PLATFORM=$(node -e "console.log(process.platform + '-' + process.arch)")
          cp target/release/mermaid-tui "npm/$PLATFORM/bin/mermaid-tui"
          chmod +x "npm/$PLATFORM/bin/mermaid-tui"

      - name: npm pack (main + platform)
        run: |
          npm pack --silent
          (cd npm/$(node -e "console.log(process.platform + '-' + process.arch)") && npm pack --silent)

      - name: Install + smoke test via npm
        run: |
          PLATFORM=$(node -e "console.log(process.platform + '-' + process.arch)")
          mkdir /tmp/install-test && cd /tmp/install-test
          npm install --omit=optional \
            $GITHUB_WORKSPACE/mermaid-to-md-*.tgz \
            $GITHUB_WORKSPACE/npm/$PLATFORM/mermaid-to-md-*.tgz
          printf 'graph TD\n  A --> B\n' | ./node_modules/.bin/mermaid-to-md
